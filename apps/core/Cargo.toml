[package]
name = "meridian-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Facade over identity, crypto, trust, session, transport, streams, signaling, store.
# Public API is canonical in docs/api/core-api-contracts.md. Sub-crates land per the roadmap;
# T01 wires in identity + store.
[dependencies]
meridian-proto = { path = "../proto" }
meridian-envelope = { path = "../envelope" }
meridian-identity = { path = "../identity" }
meridian-store = { path = "../store" }
meridian-crypto = { path = "../crypto" }
meridian-transport = { path = "../transport" }
meridian-signaling = { path = "../signaling" }
serde = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# Zeroizes superseded prekey-generation secrets (task 1.31), matching meridian-crypto's convention.
zeroize = { workspace = true }
# account.rs (task 4.13): the account-descriptor JSON + `$MERIDIAN_HOME` layout helpers, relocated
# from meridian-cli so meridian-tui (ADR 0020: core-only, never meridian-cli) can reach them too.
serde_json = { workspace = true }
hex = { workspace = true }
# Matches apps/cli/Cargo.toml's figment pin exactly (not a workspace dependency there either).
figment = { version = "0.10.19", features = ["json", "env"] }

[features]
default = []
# Forwards to meridian-transport/webrtc so `meridian_core::transport::WebRtcTransport` is available
# (real ICE/SCTP/DTLS backend, 1.15). Off by default for the same reason as the underlying crate:
# heavy dependency tree, needs real UDP/ICE.
webrtc = ["meridian-transport/webrtc"]

[dev-dependencies]
# `test-util` is needed for `#[tokio::test(start_paused = true)]` (task 1.33's answer-timeout test:
# ANSWER_TIMEOUT is 30s and this avoids actually burning 30 real seconds per test run).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# Lets the desync test (task 1.18) serialize ChatState and assert it is byte-identical before and
# after a rejected envelope — the check that stops a future contributor adding a reset-on-desync
# oracle.
ciborium = { workspace = true }
# account.rs tests (task 4.13) need a scratch $MERIDIAN_HOME directory.
tempfile = { workspace = true }
