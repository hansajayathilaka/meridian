# demo/two-orgs edge-a: the c2s TLS-terminating proxy/VIP in front of org-a's rendezvous (ADR 0008 —
# client-facing wss:// terminates at the proxy/VIP, never in-process; contrast federation's s2s mTLS,
# which DOES terminate in-process per ADR 0017 C7 and so has no proxy here at all). Raw TCP
# (`stream`), not `http`, forwarding: the rendezvous speaks plain WebSocket on the plaintext side, and
# `stream` needs no awareness of the WS upgrade handshake — it just forwards bytes after the TLS
# handshake completes, exactly like the VIP in docs/operations/diagrams/deployment-topology.mermaid.
worker_processes 1;
events { worker_connections 1024; }

stream {
    server {
        listen 8443 ssl;
        ssl_certificate     /etc/meridian/tls/org-a.test.crt;
        ssl_certificate_key /etc/meridian/tls/org-a.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass rendezvous-a:8443;
        proxy_timeout 3600s;
    }
}
