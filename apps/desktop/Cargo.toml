[package]
name = "meridian-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Tauri v2 desktop shell (ADR 0010, task 12.3): runs `meridian-core` in-process (no IPC boundary
# around secrets — the whole point of choosing Tauri over Electron) and exposes its operation
# surface to the WebView via Tauri commands/events. No window UI yet (12.15 owns that); this crate
# is the Rust backend + command layer only. Reuses `apps/store::OsSecretStore` and
# `apps/transport::WebRtcTransport` exactly as `apps/cli` does — zero new `SecretStore`/`Transport`
# code (see `src/commands.rs`'s module doc for the command/event naming convention this task
# establishes for 12.6/12.15/12.16 to follow).
[[bin]]
name = "meridian-desktop"
path = "src/main.rs"

[build-dependencies]
# Embeds `tauri.conf.json` + `dist/` at compile time; required even though 12.15 (the real window
# UI) hasn't landed yet — `tauri::generate_context!()` in `main.rs` needs this build-script output
# to exist for the crate to compile at all.
tauri-build = { version = "2", features = [] }

[features]
default = []
# Forwards to meridian-core/webrtc so the desktop backend can construct a real WebRtcTransport
# (real ICE/SCTP/DTLS, 1.15's backend) instead of only the deterministic LoopbackTransport this
# crate's own tests use for determinism — mirrors apps/cli/Cargo.toml's identical `webrtc` feature
# exactly, same reasoning (heavy dependency tree, needs real UDP/ICE) and the same off-by-default
# choice, even though a shipped desktop build would normally always enable it: keeping the default
# (no-webrtc) build lean is what lets `cargo check --workspace` stay a fast, complete signal.
webrtc = ["meridian-core/webrtc"]

[dependencies]
meridian-core = { path = "../core" }
# The already-built `mrd.file/1` sender/receiver engines (chunking/merkle/per-chunk-AEAD) this
# crate's `file_send` command and inbound-transfer tracking wire to an already-established
# `P2pSession` — orchestration only, mirrors `apps/cli/src/send.rs`'s identical reuse.
meridian-streams = { path = "../streams" }
tauri = { version = "2", features = [] }
# Task 12.16 / ADR 0027: Tauri's own Ed25519/minisign-style updater-signature scheme — a bundled
# public key (`tauri.conf.json`'s `plugins.updater.pubkey`) verified client-side before an update is
# applied. This is the ONLY signing this crate wires up; OS-trusted Authenticode/notarization signing
# stays deferred (ADR 0027 R1, same residual class as ADR 0022/0023's own).
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# `file_send`'s per-transfer `k_f` (unsealed from the ratchet, held until the send loop finishes)
# needs the same `Zeroizing` wrapping every other holder of this key uses — mirrors
# `apps/cli/Cargo.toml`'s identical direct edge onto this crate for the identical reason.
zeroize = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
# `keyring` (the all-in-one v1 wrapper) installs a real platform credential store for
# `OsSecretStore` — mirrors `apps/cli/Cargo.toml`'s identical dependency and reasoning.
keyring = "4.1.4"

[dev-dependencies]
tempfile = { workspace = true }
# Task 12.16's acceptance test (`tests/updater_rejects_tampered.rs`) drives the real
# `tauri-plugin-updater` check/download path end to end against a local mock update server, so it
# needs: a full (mock) Tauri app to host the plugin (`tauri`'s own `test` feature,
# `tauri::test::mock_app`/`MockRuntime`); an HTTP server to serve a `latest.json` manifest + artifact
# bytes (`axum`, already a workspace dependency for the rendezvous server); `url::Url` (the exact type
# `UpdaterBuilder::endpoints` takes); and `minisign`/`base64` to sign test fixtures with a LOCAL,
# TEST-ONLY keypair (never the real `TAURI_SIGNING_PRIVATE_KEY` CI secret) using the identical
# minisign format `tauri-plugin-updater`'s own `verify_signature` expects. `tokio`'s `net` feature
# (TcpListener) is dev-only — resolver "2" keeps it out of the production binary's feature set.
tauri = { version = "2", features = ["test"] }
tokio = { workspace = true, features = ["net"] }
axum = { workspace = true }
url = "2"
minisign = "0.9"
base64 = "0.22"
