# Builds and pushes the meridian-rendezvous (signaling server) image to the GitHub Container
# Registry (ghcr.io) whenever a PR merges to main. Runtime config docs: docs/operations/docker-image.md.
#
# No repo secrets to configure: ghcr.io authenticates with the workflow's built-in GITHUB_TOKEN
# (the `packages: write` permission below). The image is published under the repository owner as
# ghcr.io/<owner>/meridian-rendezvous. The only one-time setup is making the package public (or
# granting pull access) after the first publish — see docs/operations/docker-image.md §2.
name: docker-publish

on:
  push:
    branches: [main]
    # rendezvous depends only on meridian-proto (enforced by tools/lint-server-no-core.sh), so
    # these paths are the complete, provably-sufficient set of inputs to its image — a docs-only
    # or other-crate-only merge to main does not publish a new (identical) image.
    paths:
      - "apps/rendezvous/**"
      - "apps/proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-publish.yml"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push meridian-rendezvous image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to ghcr.io — no DOCKERHUB_* secrets needed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        # ghcr.io requires the repository path to be lowercase; the owner login usually already is,
        # but lowercasing here keeps this correct for mixed-case orgs/users too.
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/meridian-rendezvous" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          # Link the package to this repo and record provenance in the image's OCI labels.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/rendezvous/Dockerfile
          # Single-arch to start (fast, native runner build — no qemu emulation). Extending to
          # linux/arm64 is a one-line change here; see docs/operations/docker-image.md.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
