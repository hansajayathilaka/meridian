[package]
name = "meridian-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Facade over identity, crypto, trust, session, transport, streams, signaling, store.
# Public API is canonical in docs/api/core-api-contracts.md. Sub-crates land per the roadmap;
# T01 wires in identity + store.
[dependencies]
meridian-proto = { path = "../proto" }
meridian-envelope = { path = "../envelope" }
meridian-identity = { path = "../identity" }
meridian-store = { path = "../store" }
meridian-crypto = { path = "../crypto" }
meridian-transport = { path = "../transport" }
meridian-signaling = { path = "../signaling" }
serde = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
getrandom = { workspace = true }
# Zeroizes superseded prekey-generation secrets (task 1.31), matching meridian-crypto's convention.
zeroize = { workspace = true }
# account.rs (task 4.13): the account-descriptor JSON + `$MERIDIAN_HOME` layout helpers, relocated
# from meridian-cli so meridian-tui (ADR 0020: core-only, never meridian-cli) can reach them too.
serde_json = { workspace = true }
hex = { workspace = true }
# Matches apps/cli/Cargo.toml's figment pin exactly (not a workspace dependency there either).
figment = { version = "0.10.19", features = ["json", "env"] }

[features]
default = []
# Forwards to meridian-transport/webrtc so `meridian_core::transport::WebRtcTransport` is available
# (real ICE/SCTP/DTLS backend, 1.15). Off by default for the same reason as the underlying crate:
# heavy dependency tree, needs real UDP/ICE.
webrtc = ["meridian-transport/webrtc"]

# tokio, split per-target (task 12.4 — same additive-union discovery task 12.1 made for
# `apps/transport/Cargo.toml`, applied here): a bare `tokio = { workspace = true, features =
# ["sync"] }` does not *restrict* the workspace's shared tokio spec down to `sync` — a member's own
# `features = [...]` list unions onto the workspace default (`["rt-multi-thread","macros","net",
# "sync","time","io-util"]`) rather than narrowing it, so this crate was silently linking the full
# set, `net`/`rt-multi-thread` (hence `mio`) included, on every target — harmless on native, fatal
# on wasm32-unknown-unknown (no epoll/real threads/TCP for `mio` to bind to). Confirmed by actually
# running this task's `cargo check -p meridian-core --target wasm32-unknown-unknown` once
# `meridian-signaling` (the other wasm32 blocker) was fixed, not assumed — `session.rs`/the rest of
# this crate only ever touches `tokio::sync` (`mpsc`, `session.rs`) and, via the `time_compat` seam
# below, `tokio::time` (native only — wasm32 substitutes `wasmtimer`), so a minimal `sync`-only
# wasm32 dependency is sufficient.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }

# wasm32-unknown-unknown only (task 12.1, T11 browser substrate): `session.rs`'s `time_compat` seam
# needs a `tokio::time`-shaped `timeout`/`Instant` substitute for this target (`tokio::time`'s own
# driver has no story for wasm32 — see `apps/transport/Cargo.toml`'s own `mio` discovery from this
# same task). Build-verified for the first time by task 12.4, which closed the remaining
# `meridian-signaling` blocker — see `time_compat`'s own doc comment in `src/session.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmtimer = "0.2"
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
# `test-util` is needed for `#[tokio::test(start_paused = true)]` (task 1.33's answer-timeout test:
# ANSWER_TIMEOUT is 30s and this avoids actually burning 30 real seconds per test run).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# Lets the desync test (task 1.18) serialize ChatState and assert it is byte-identical before and
# after a rejected envelope — the check that stops a future contributor adding a reset-on-desync
# oracle.
ciborium = { workspace = true }
# account.rs tests (task 4.13) need a scratch $MERIDIAN_HOME directory.
tempfile = { workspace = true }
# eid_dedup.rs property coverage (task 7.4, review finding F6) — same pin apps/identity already uses.
proptest = { workspace = true }
