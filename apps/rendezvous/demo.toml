# Demo config for the T02 working-output script
# (docs/architecture/features/02-rendezvous-mvp.md). Open admission, tamper hook ON so
# `meridian fetch-bundle --tamper` can demonstrate the malicious-server abort. NOT for production.
# The tamper hook only exists when the server binary is built with `--features test-tamper-hook`
# (F17); this flag is inert (and the field absent) in default/release builds.

[server]
domain = "localhost"
bind = "0.0.0.0:8443"
admission = "open"
allow_test_tamper = true
# Deliberately left OFF: this is the umbrella gate for tampering with every ROUTED blob in transit
# (rewrite, from-spoofing, replay, reorder, drop, cross-delivery — tasks 1.28 and 1.32), which would
# break the demo's own chat/session flows rather than just the bundle fetch. The adversarial tests
# enable it, plus exactly one attack's own mode flag, in-process, for their own server instance
# only. The per-attack flags (allow_test_route_rewrite/_spoof_from/_replay/_drop/_reorder/
# _cross_deliver — see rendezvous.example.toml) all default to false and are omitted here.
allow_test_route_tamper = false
