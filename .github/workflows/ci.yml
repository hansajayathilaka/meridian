# Meridian CI: lint (incl. invariants) -> test-* (parallel: build+unit/coverage, tamper-hook,
# webrtc, harnesses+conformance, NAT matrix) -> build. Mirrors the `just` recipes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Repo invariants (server-no-core, no-serde-on-blob, metrics-allowlist, no-raw-id-logging)
        run: |
          bash tools/lint-server-no-core.sh
          # Guards the guard: fails CI if the cargo-tree check stops catching a TRANSITIVE core
          # dependency — the route the old grep-based lint could never see (F21).
          bash tools/lint-server-no-core.sh --selftest
          # ADR 0020 condition 3: meridian-tui depends on meridian-core only, never meridian-cli.
          bash tools/lint-tui-no-cli.sh
          bash tools/lint-tui-no-cli.sh --selftest
          bash tools/lint-no-serde-on-blob.sh
          # Guards the guard: fails CI if a future edit to the lint silently regresses its
          # module-qualified-path / multi-line bypass coverage (F15).
          bash tools/lint-no-serde-on-blob.sh --selftest
          bash tools/lint-metrics-allowlist.sh
          # Invariant #4: no raw identifiers in server log lines (F21). Landed ahead of the
          # observability stack so the first log line added cannot break it silently.
          bash tools/lint-no-raw-id-logging.sh
          bash tools/lint-no-raw-id-logging.sh --selftest
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The former single `test` job ran everything below sequentially on one runner (~25.5 minutes:
  # see the per-job durations noted next to each job here, measured from the last run when this
  # was one job). Split into independent jobs — each already an independent `cargo`/`bash`
  # invocation with its own feature resolution, unaffected by which job runs it — so they run
  # concurrently and the test *stage*'s wall-clock drops to its longest single piece (~10.5 min,
  # `test-core`) instead of the sum of all of them. `build` (release) below now `needs` every job
  # here, preserving the original all-must-pass gate. NOTE: this changes the CI check names —
  # if branch protection on `main` requires the old "Test + adversarial harnesses" check by name,
  # it must be updated to require these instead (see docs/operations/docker-image.md §1's existing
  # TODO on this — no agent-accessible tool can read or fix branch-protection config directly).
  test-core:
    name: "Test: build + unit/integration + coverage (~10.5min)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Coverage (task 1.21 / F22) is measured off THIS build+test run rather than a separate job
      # that repeats it under instrumentation. `show-env` is sourced only inside these two steps
      # (not exported job-wide via $GITHUB_ENV), so this job's instrumentation can't leak into any
      # other parallel test-* job. If this build or the test run below fails, the job stops here
      # and the coverage-report steps at the bottom never run, so a failed run never gets a
      # coverage number either.
      - name: Build (instrumented for coverage)
        run: |
          cargo llvm-cov clean --workspace
          source <(cargo llvm-cov show-env --export-prefix)
          cargo build --workspace
      - name: Unit + integration tests (instrumented for coverage)
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo test --workspace
      # Reports region/line/function coverage from the instrumented Build + Unit/integration steps
      # above so the number is visible in CI (task 1.21 / F22) instead of asserted in a spec.
      # Deliberately non-blocking (continue-on-error): no threshold is enforced here — gating is a
      # separate, later decision. Note that Rust on stable emits no branch coverage, so a "branch
      # coverage" target is not measurable here.
      - name: Coverage summary
        continue-on-error: true
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov report --summary-only
      - name: Coverage report (lcov artifact)
        continue-on-error: true
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: hashFiles('lcov.info') != ''
        continue-on-error: true
        with:
          name: coverage-lcov
          path: lcov.info

  test-tamper-hook:
    name: "Test: tamper-hook feature gate (~1.5min)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # REQUIRED for F17. Resolver-2 feature unification turns `test-tamper-hook` ON
      # workspace-wide whenever dev targets are built, because apps/cli's dev-dependency pins that
      # feature — so every #[cfg(not(feature = "test-tamper-hook"))] guard in
      # apps/rendezvous/tests is compiled OUT under a workspace-wide build/test (as run in
      # test-core). This package-scoped run with default features is the only invocation under
      # which the tamper-hook inertness guards execute at all. Before it existed,
      # `tamper_flag_is_inert_without_feature` (task 1.12) had never run in CI.
      # NOTE: this step needs no change as guards are added — it is package-scoped and runs the whole
      # default-feature test binary, so task 1.32's per-mode inertness tests
      # (route_{spoof_from,replay,reorder,drop,cross_deliver}_is_inert_without_feature and
      # all_route_modes_are_inert_without_feature) are picked up automatically. Task 2.12's
      # `apps/rendezvous/tests/federation_abuse.rs` (the FEDERATED bundle-substitution tamper hook,
      # `fed_fetch_tamper_flag_is_inert_without_feature`) is picked up the same way — no edit needed
      # here either, which is the point of this step being package-scoped rather than `--test`-filtered.
      - name: Tamper-hook compile-gate guards (default features only — see comment)
        run: cargo test -p meridian-rendezvous
      # The MIRROR of the step above, and just as load-bearing. The runtime-gate tests — the
      # `route_tamper` unit tests, `umbrella_flag_alone_arms_no_attack`, and
      # `route_tamper_requires_its_own_flag_not_just_allow_test_tamper` — are all
      # #[cfg(feature = "test-tamper-hook")], so they are compiled OUT of the default-features step
      # above. Without this step they would execute only as a SIDE EFFECT of resolver-2 unification
      # under a workspace-wide `cargo test --workspace` (as run in test-core), via apps/cli's
      # dev-dependency feature pin. That is the same accidental coupling task 1.28's review flagged
      # as a hazard, load-bearing in the other direction: dropping that pin (the hygienic thing to
      # do) would silently stop running every runtime-gate test everywhere — `-p` with default
      # features compiles them out, `--workspace` runs them TODAY only via that dev-dep accident,
      # and mitm-sim's filtered invocation skips them. (Stated precisely because it is checkable:
      # right now `cargo test --workspace` does run them. A reader who checks a sloppier claim,
      # finds it false, and concludes this step is stale might delete it — which is exactly the
      # regression it exists to prevent.) Feature-on coverage must not depend on a dev-dep. Also
      # runs task 2.12's federated A2×2 cell
      # (`federation_abuse.rs::cross_org_malicious_server_bundle_substitution_is_rejected_by_the_client`)
      # for the same reason: package-scoped, feature ON, no `--test` filter.
      - name: Tamper-hook runtime-gate tests (feature ON — see comment)
        run: cargo test -p meridian-rendezvous --features test-tamper-hook
      # F17, checked at the level that actually decides it: feature *resolution*. A release/normal
      # build must not activate `test-tamper-hook`, even though apps/cli's DEV-dependency pins it —
      # resolver 2 is what keeps dev-dep features out of the normal graph, and this step fails if
      # that ever stops holding (a resolver downgrade, or someone promoting the dev-dep).
      #
      # Deliberately NOT an `nm`-symbol check on the release binary: that was tried and is worthless
      # here — the symbol is absent from an optimised build whether the feature is on or off, so it
      # would pass in both cases. A check that cannot fail is not a gate (cf. F4/F18).
      - name: test-tamper-hook is not active in a normal/release build (F17)
        run: |
          set -euo pipefail
          # Capture cargo's own exit status, not grep's. Without `set -o pipefail` (and the explicit
          # empty check below) a `cargo tree` failure would leave $feats empty, and an empty string
          # trivially fails the `grep -q` — i.e. the gate would PASS precisely when it could not
          # verify anything. Fail closed instead: no parsed output is a hard error, never a pass.
          tree=$(cargo tree --workspace -e normal -f '{p} {f}')
          feats=$(printf '%s\n' "$tree" | grep -o 'meridian-rendezvous v[^ ]* ([^)]*) .*' | head -1 || true)
          if [ -z "$feats" ]; then
            echo "::error::could not resolve meridian-rendezvous features from 'cargo tree' output — refusing to pass a check that verified nothing (F17)." >&2
            printf '%s\n' "$tree" | head -20 >&2
            exit 1
          fi
          echo "resolved: $feats"
          if printf '%s' "$feats" | grep -q 'test-tamper-hook'; then
            echo "::error::test-tamper-hook is active in a NORMAL (non-dev) build — the hook would ship in the release binary (F17)." >&2
            exit 1
          fi
          echo "OK: normal build does not activate test-tamper-hook."

  test-webrtc:
    name: "Test: real webrtc-rs transport backend (~7min)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Real webrtc-rs transport backend (1.15; real ICE/SCTP/DTLS on localhost, no NET_ADMIN needed)
        run: |
          cargo test -p meridian-transport --features webrtc
          cargo test -p meridian-core --features webrtc
          cargo test -p meridian-cli --features webrtc

  test-harnesses:
    name: "Test: build-shape check + adversarial/cross-org harnesses + conformance (~3min)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ADR 0020 condition 2 / task 4.12: --no-default-features must still build (and must not pull
      # in ratatui/crossterm via the default-on `tui` feature) — the lean build shape demo/CI
      # scripts rely on. Not a one-time local check: this is the ongoing CI enforcement the ADR's
      # Consequence section calls for.
      - name: meridian-cli --no-default-features stays lean (ADR 0020)
        run: |
          cargo build -p meridian-cli --no-default-features
          tree=$(cargo tree -p meridian-cli --no-default-features -e normal)
          if printf '%s\n' "$tree" | grep -qE 'meridian-tui|ratatui|crossterm'; then
            echo "::error::meridian-cli --no-default-features pulled in meridian-tui/ratatui/crossterm — the tui feature must be fully optional (ADR 0020 condition 2)." >&2
            printf '%s\n' "$tree" >&2
            exit 1
          fi
          echo "OK: --no-default-features build carries no TUI dependency tree."
      - name: Adversarial harnesses
        run: |
          bash harnesses/opacity-audit/run.sh
          bash harnesses/mitm-sim/run.sh
          bash harnesses/ghost-device/run.sh
      # Task 2.12 (phase-2 exit gate): the cross-org abuse + acceptance suite. Already covered by
      # test-core's workspace-wide test run too (no feature-gating on this file), but named
      # explicitly here — same convention as the harness invocations above — so the phase exit gate
      # is discoverable as its own CI line rather than buried in a workspace-wide run.
      - name: Cross-org abuse + acceptance suite (2.12)
        run: |
          cargo test -p meridian-rendezvous --features test-tamper-hook --test federation_abuse
          cargo test -p meridian-cli --test two_orgs_walkthrough
      # TODO: migrate to cargo nextest run --workspace
      - name: Conformance vectors (byte-identical across CLI/WASM/mobile) — docs/testing/strategy.md §1
        run: |
          cargo run -p xtask -- vectors
          git diff --exit-code -- test-vectors/ || {
            echo "::error::test-vectors/ drifted from the xtask generator — vectors are canonical, never hand-edited. Regenerate with 'cargo run -p xtask -- vectors' and commit the diff (a wire/derivation change needs architect + security-reviewer sign-off)." >&2
            exit 1
          }
          cargo test -p meridian-crypto --test conformance

  test-nat-matrix:
    name: "Test: NAT matrix + relay policy (~3.5min)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tools/netns-nat-matrix.sh's wire-level rig shells out to this example (the real
      # TurnReq/TurnGrant wire flow) but never builds it — it only checks that
      # ./target/debug/examples/fetch_turn_credentials already exists and errors if not. In the
      # former single `test` job this came for free: `cargo test --workspace` compiles every
      # example as part of its default target set (to compile-check them, even though it doesn't
      # run them), so an earlier step in that same job left the binary sitting in the job's shared
      # target/ dir by the time this ran. Split onto its own runner, this job starts from an empty
      # target/ dir and needs its own explicit build.
      - name: Build fetch_turn_credentials example (needed by the netns rig)
        run: cargo build -p meridian-rendezvous --example fetch_turn_credentials
      - name: NAT matrix + relay policy (T05; netns rig skips without NET_ADMIN)
        run: bash harnesses/nat-matrix/run.sh

  build:
    name: Build (release)
    needs: [test-core, test-tamper-hook, test-webrtc, test-harnesses, test-nat-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release

  docker-build:
    name: Docker build gate (apps/rendezvous/Dockerfile)
    # F12 (Phase-3 review) / task 3.12: docker-publish.yml only builds + pushes AFTER a merge to
    # main, so a broken Dockerfile/entrypoint (bad COPY path, a cargo build regression under the
    # `sqlite` feature, a privilege-drop or chown mistake) was only ever discovered post-merge.
    # This job builds the exact same file on every PR — before merge — but never pushes and never
    # sees a registry credential: no `docker/login-action`, no `packages: write` permission below,
    # and (unlike docker-publish.yml) no GITHUB_TOKEN login step at all. Keep it that way — this
    # gate must not become a second path that can leak the publish credential.
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build-only, no push, no registry login. --load pulls the image into the local docker
      # engine so the smoke-test steps below can run it.
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/rendezvous/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: meridian-rendezvous:ci-gate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the image must actually bind and must actually drop root before running
      # application code (docker-entrypoint.sh's whole job — see docs/operations/docker-image.md
      # §1). No plaintext ever crosses this box, so nothing here inspects request/response bodies;
      # it only checks that the container comes up and that PID 1 is the unprivileged `meridian`
      # user, not root.
      - name: docker run smoke test (bind + privilege drop)
        run: bash tools/docker-smoke-test.sh meridian-rendezvous:ci-gate rendezvous-smoke 18443

      - name: cleanup
        if: always()
        run: |
          docker rm -f rendezvous-smoke >/dev/null 2>&1 || true
          docker volume rm rendezvous-smoke-data >/dev/null 2>&1 || true

  supply-chain:
    name: License / advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Enforces the vodozemac/no-AGPL decision (ADR 0011/0015) via deny.toml.
      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    name: Docs (mermaid + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install mermaid-cli
        run: npm i -g @mermaid-js/mermaid-cli
      - name: Validate docs (links + mermaid)
        run: bash tools/check-docs.sh
