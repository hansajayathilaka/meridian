[package]
name = "meridian-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Reference terminal client and T01 demo driver. Drives identity through meridian-core.
[[bin]]
name = "meridian"
path = "src/main.rs"

[features]
default = []
# Forwards to meridian-core/webrtc so `--transport webrtc` can construct a real WebRtcTransport
# (1.15's real ICE/SCTP/DTLS backend) instead of the deterministic LoopbackTransport. Off by default
# for the same reason as the underlying crates: heavy dependency tree, needs real UDP/ICE.
webrtc = ["meridian-core/webrtc"]

[dependencies]
meridian-core = { path = "../core" }
# `keyring` (the all-in-one v1 wrapper) installs a real platform credential store for `--store os`.
keyring = "4.1.4"
clap = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
age = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
getrandom = { workspace = true }
figment = { version = "0.10.19", features = ["json", "env"] }

[dev-dependencies]
tempfile = { workspace = true }
# Drive the real server in-process for the register/fetch-bundle demo (T02). test-tamper-hook is
# needed so the --tamper demo path (fetch-bundle --tamper) still exercises the substituted-bundle
# rejection; it's a dev-only feature, never enabled in the release meridian-rendezvous binary.
meridian-rendezvous = { path = "../rendezvous", features = ["test-tamper-hook"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "sync", "time", "io-util"] }
# Task 2.9: two-org in-process s2s mTLS harness for the federation-error acceptance test
# (mirrors apps/rendezvous/tests/federation_fetch.rs's PKI fixture).
rcgen = "0.13"
# T3.13/F13: `apps/cli/tests/wss_tls.rs` connects `SignalingClient::connect_with_test_ca_pem`
# (test-support-gated) to a real self-signed TLS WebSocket listener, proving the crypto-provider
# install in `meridian_signaling::install_crypto_provider` actually unblocks a `wss://` handshake.
# `test-support` is a dev-dependency feature (same shape as `meridian-rendezvous`'s
# `test-tamper-hook` above), never enabled in the release `meridian` binary.
meridian-signaling = { path = "../signaling", features = ["test-support"] }
# The test's own TLS-terminating listener (simulating the reverse proxy that terminates `wss://`
# in production, ADR 0008 / apps/rendezvous/Cargo.toml's `tokio-rustls` comment) — feature list
# mirrors apps/rendezvous/Cargo.toml's own rustls/tokio-rustls entries (`std` for
# `ServerConfig::builder()`/PEM file loading; explicit `ring`, not aws-lc-rs, for the single-backend
# reason noted on meridian-signaling's own rustls dependency).
#
# NOTE (T3.13/F13 Outcome): `rustls/custom-provider` was tried here to force the mutation-check
# fully non-vacuous (rustls's `ClientConfig::builder()`/`ServerConfig::builder()` otherwise
# silently self-install a provider whenever exactly one provider feature is compiled in, which
# would mask deleting `install_crypto_provider()`'s call). It was reverted: this dev-dependency
# edge's features unify workspace-wide with `--features webrtc` builds, where `dtls` (via
# `webrtc` → `meridian-transport`) also depends on `rustls` for its own purposes — enabling
# `custom-provider` broke ICE/DTLS in `session_demo_webrtc.rs` (reproducible, confirmed by
# bisection). See the task file's Outcome for the full reasoning and what this means for the
# mutation-check's actual coverage.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
