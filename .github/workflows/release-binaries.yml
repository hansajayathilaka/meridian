# Builds native `meridian` (meridian-cli, TUI included by default per ADR 0020) executables for
# Linux and Windows and publishes them to a rolling GitHub Release, so anyone can download a client
# binary and run `meridian tui` locally without building from source. See ADR 0023 (supersedes 0022
# — the original version of this pipeline built the meridian-rendezvous SERVER, not the client) and
# docs/operations/release-binaries.md for the "why".
name: release-binaries

on:
  push:
    branches: [main]
    # meridian-cli's own dependency graph (apps/cli + everything it pulls in transitively: core,
    # tui, identity, store, crypto, transport, signaling, proto, envelope) minus meridian-rendezvous,
    # which meridian-cli does not link into its release binary (only a dev-dependency, for tests).
    # Deliberately decoupled from docker-publish.yml's trigger — that pipeline ships the SERVER
    # image, this one ships the CLIENT binary; the two have no shared inputs worth coupling on.
    paths:
      - "apps/**"
      - "!apps/rendezvous/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-binaries.yml"
  workflow_dispatch: {}

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring (pulled in via meridian-signaling's wss:// client, always on — not behind the `tui`
      # feature) compiles x86_64 assembly on Windows via nasm; windows-latest does not carry nasm
      # preinstalled.
      - name: Install nasm (Windows only, ring's asm build step)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-binaries-${{ matrix.target }}

      - name: Compute short sha
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Default features (`tui` is default-on, ADR 0020) — the same shape as `cargo install
      # --path apps/cli` or a plain `cargo build -p meridian-cli` gives a user; this is what makes
      # `meridian tui` exist in the resulting binary.
      - name: cargo build --release
        run: cargo build --release -p meridian-cli --target ${{ matrix.target }} --feature webrtc

      - name: Package (Linux)
        if: matrix.asset_os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="stage/meridian-${{ matrix.asset_os }}-x86_64"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/meridian" "$stage/"
          name="meridian-${{ matrix.asset_os }}-x86_64-${{ steps.sha.outputs.short }}.tar.gz"
          tar -C stage -czf "$name" "$(basename "$stage")"
          echo "asset=$name" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          $stageName = "meridian-${{ matrix.asset_os }}-x86_64"
          $stage = "stage/$stageName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/meridian.exe" -Destination $stage
          $name = "meridian-${{ matrix.asset_os }}-x86_64-${{ steps.sha.outputs.short }}.zip"
          Compress-Archive -Path $stage -DestinationPath $name
          echo "asset=$name" >> $env:GITHUB_ENV

      - name: sha256sum
        shell: bash
        run: sha256sum "${{ env.asset }}" > "${{ env.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-cli-${{ matrix.asset_os }}
          path: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish rolling GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Rolling release, same policy as docker-publish.yml's `:latest` image tag: `cli-latest`
      # always points at the assets from the most recent qualifying push to main. The short-sha
      # baked into each asset's filename is what gives a specific download commit-level
      # traceability.
      - name: Create/update cli-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: meridian CLI/TUI (latest)
          body: |
            Automatically built from commit `${{ github.sha }}` by the `release-binaries` workflow.
            This release is rolling — its assets are replaced on every qualifying push to `main`.
            Contains the `meridian` client binary (Linux + Windows), including the `meridian tui`
            subcommand. Verify a download against its `.sha256` file before trusting it (see
            `docs/operations/release-binaries.md`).
          prerelease: true
          make_latest: false
          files: dist/*
