[package]
name = "meridian-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# T01: the SecretStore trait (docs/api/core-api-contracts.md) + two production impls —
# OS keystore (keyring-core) and passphrase-wrapped file (age/scrypt) for headless — plus an
# in-memory impl used by tests and the "keys never hit disk in plaintext" harness.
# Dependency direction (docs/architecture/stack.md §3): a leaf that meridian-identity depends on.
[dependencies]
age = { workspace = true }
keyring-core = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }
# X3DH (T03) needs Diffie–Hellman with the account key. We convert the Ed25519 seed to its
# birationally-equivalent X25519 secret (libsodium `crypto_sign_ed25519_sk_to_curve25519`) so the
# DH runs *through the store* and the private key never leaves it (crypto-protocols skill rule 6).
x25519-dalek = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# wasm32-unknown-unknown only (task 12.1, T11 browser substrate — no browser Transport/SecretStore
# impl lands here yet, this only makes the crate itself *compile* for the target).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.3 (above) has no default wasm backend; its `wasm_js` Cargo feature (+ the matching
# `--cfg getrandom_backend="wasm_js"` rustflag in .cargo/config.toml) opts into a wasm-bindgen-backed
# source of OS randomness. See https://docs.rs/getrandom/#webassembly-support.
getrandom = { workspace = true, features = ["wasm_js"] }
# `age` (above) pulls in `rand 0.8`, which transitively needs a *second*, older getrandom (0.2.x,
# via rand_core 0.6) — a separate crate instance from the 0.3 one directly above, with its own,
# unrelated wasm activation switch (Cargo feature "js", not a `--cfg` rustflag). This surfaced only
# by actually running the wasm32 `cargo check` this task requires (its own "verify, don't assume"
# instruction), not from anything enumerated up front. This edge exists purely to turn that feature
# on for the whole build graph — Cargo unifies features per resolved dependency version across every
# crate that uses it, so this alone is enough without touching `age`/`x25519-dalek`'s own manifests;
# nothing in this crate calls the 0.2 copy directly, hence the local rename.
getrandom-0-2-js = { package = "getrandom", version = "0.2", features = ["js"] }
# Task 12.5 (ADR 0026 binding condition 1): `WebCryptoSecretStore`, the browser-only `SecretStore`
# impl backed by non-extractable `crypto.subtle` `CryptoKey`s. Both `getrandom`s above are already
# pulled transitively through `wasm-bindgen`/`js-sys` (see Cargo.lock), so these add no new
# ecosystem surface, only direct, explicit deps on what `webcrypto.rs` calls.
wasm-bindgen = "0.2"
# `Crypto`/`SubtleCrypto`/`CryptoKey` (key import/sign/deriveBits); `HkdfParams`/
# `EcdhKeyDeriveParams` (algorithm-identifier objects for HKDF-Expand and X25519 `deriveBits`
# respectively — Ed25519 sign/import pass their algorithm identifier as a plain string, per spec).
web-sys = { version = "0.3", features = [
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "HkdfParams",
    "EcdhKeyDeriveParams",
] }
js-sys = "0.3"
# Bridges a `crypto.subtle` call's returned `Promise` to a Rust `Future` (`JsFuture`). Every
# `crypto.subtle` method is Promise-based by spec (implementations may dispatch to hardware/HSMs),
# so this crate's WebCrypto calls are genuinely async — see `webcrypto.rs`'s module doc for how
# that interacts with `SecretStore`'s synchronous trait signature.
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
