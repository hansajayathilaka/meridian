# Internal DNS for the two-org demo's SRV-discovery profile (task 2.11 deliverable 2).
#
# Forwards everything ordinary (plain docker-compose service names, e.g. `rendezvous-a`) straight
# to Docker's own embedded resolver (127.0.0.11 — reachable from any container on a user-defined
# bridge network, including this one), and adds exactly two kinds of records on top:
#   - `cname=` — the org hint-domains (`org-a.test`/`org-b.test`) as aliases for the edge proxies
#     that actually terminate client wss:// (edge-a/edge-b; see docker-compose.yml) — these MUST
#     point at the edge, never straight at the rendezvous container: the rendezvous's c2s port
#     speaks plain ws:// (ADR 0008: TLS terminates at the proxy/VIP, never in-process), so
#     resolving org-a.test straight to it would hand a wss:// client a bare WebSocket where it
#     expects a TLS handshake.
#   - `srv-host=` — the real `_meridian-fed._tcp.<domain>` SRV record
#     (apps/rendezvous/src/federation/discovery.rs's `SrvDiscovery`) naming each org's federation
#     listener directly (rendezvous-a/-b:8444, which DOES terminate TLS in-process — ADR 0017 C7 —
#     so no edge proxy is involved on this side) — this is what makes SRV mode genuine rather than
#     faked: an operator (or this demo) could point any RFC-2782-compliant resolver at real records
#     shaped exactly like this.
no-resolv
server=127.0.0.11

cname=org-a.test,edge-a
cname=org-b.test,edge-b

# srv-host=<name>,<target>,<port>,<priority>,<weight>
srv-host=_meridian-fed._tcp.org-a.test,rendezvous-a,8444,0,0
srv-host=_meridian-fed._tcp.org-b.test,rendezvous-b,8444,0,0
