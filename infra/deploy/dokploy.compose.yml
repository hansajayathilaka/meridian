# Meridian rendezvous + coturn — production stack for Dokploy (or any docker-compose host).
# Full walkthrough: ../../docs/operations/docker-image.md#6-running-this-on-dokploy
#
# Everything you'll ever need to change lives in environment variables — copy dokploy.env.example
# to the values Dokploy asks for (its "Environment" tab for a compose app, or a plain `.env` file
# next to this one for `docker compose up`) and redeploy; no image rebuild, no editing this file.
#
# What this does NOT do: run Postgres. meridian-rendezvous only supports SQLite today (the `sqlite`
# cargo feature baked into the published image, apps/rendezvous/Cargo.toml) — Postgres support is
# tracked but unimplemented, so a Postgres container here would just sit unused. Persistence is a
# named volume holding the SQLite file instead.
services:
  rendezvous:
    image: ${RENDEZVOUS_IMAGE:?set RENDEZVOUS_IMAGE, e.g. ghcr.io/hansajayathilaka/meridian-rendezvous:latest — see docs/operations/docker-image.md}
    # `docker compose up`, even with `--build`, does NOT re-pull an `image:`-referenced tag on its
    # own — `--build` only rebuilds services with a `build:` context, which this one doesn't have.
    # Without this, a host that already has an old `:latest` cached locally keeps reusing it forever,
    # silently ignoring every new image docker-publish.yml pushes. `pull_policy: always` forces an
    # actual re-pull (and a no-op if the registry's digest for the tag hasn't changed) on every deploy.
    pull_policy: always
    restart: unless-stopped
    ports:
      # Do NOT set RENDEZVOUS_PORT=443: Dokploy's own Traefik already owns host port 443 for HTTPS
      # routing, and this container would fail to bind it too. Leave this at a free port and expose
      # rendezvous.<yourdomain> over 443 via Dokploy's Domain UI pointed at container port 8443
      # instead — see docs/operations/docker-image.md §6.
      - "${RENDEZVOUS_PORT:-8443}:8443"
    volumes:
      # Holds the SQLite file backing MERIDIAN_RENDEZVOUS_SERVER__DATABASE_URL below — survives
      # container recreation/redeploys. In Dokploy's UI this shows up as a mountable volume too.
      - rendezvous_data:/data
    environment:
      # --- [server] --------------------------------------------------------------------------
      MERIDIAN_RENDEZVOUS_SERVER__DOMAIN: ${MERIDIAN_RENDEZVOUS_SERVER__DOMAIN:?set MERIDIAN_RENDEZVOUS_SERVER__DOMAIN, e.g. chat.example.com — the hint-domain folded into the auth challenge}
      MERIDIAN_RENDEZVOUS_SERVER__ADMISSION: ${MERIDIAN_RENDEZVOUS_SERVER__ADMISSION:-open}
      # Only read when ADMISSION=invite. JSON array syntax, e.g. ["tok-a","tok-b"] — NOT comma-separated.
      MERIDIAN_RENDEZVOUS_SERVER__INVITE_TOKENS: ${MERIDIAN_RENDEZVOUS_SERVER__INVITE_TOKENS:-[]}
      MERIDIAN_RENDEZVOUS_SERVER__DATABASE_URL: ${MERIDIAN_RENDEZVOUS_SERVER__DATABASE_URL:-sqlite:///data/rendezvous.db}
      # --- [limits] — anti-abuse, fixed one-minute windows ------------------------------------
      MERIDIAN_RENDEZVOUS_LIMITS__AUTH_PER_IP_PER_MIN: ${MERIDIAN_RENDEZVOUS_LIMITS__AUTH_PER_IP_PER_MIN:-60}
      MERIDIAN_RENDEZVOUS_LIMITS__FETCH_PER_ACCOUNT_PER_MIN: ${MERIDIAN_RENDEZVOUS_LIMITS__FETCH_PER_ACCOUNT_PER_MIN:-120}
      MERIDIAN_RENDEZVOUS_LIMITS__ROUTE_PER_ACCOUNT_PER_MIN: ${MERIDIAN_RENDEZVOUS_LIMITS__ROUTE_PER_ACCOUNT_PER_MIN:-600}
      MERIDIAN_RENDEZVOUS_LIMITS__TURN_PER_ACCOUNT_PER_MIN: ${MERIDIAN_RENDEZVOUS_LIMITS__TURN_PER_ACCOUNT_PER_MIN:-60}
      # --- [turn] — ephemeral TURN credential minting -----------------------------------------
      # MUST equal coturn's --static-auth-secret below — both read the same TURN_SHARED_SECRET.
      MERIDIAN_RENDEZVOUS_TURN__SECRET: ${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET — a long random value, shared verbatim with the coturn service below, never committed}
      MERIDIAN_RENDEZVOUS_TURN__REALM: ${MERIDIAN_RENDEZVOUS_TURN__REALM:-${TURN_DOMAIN:-turn.example.com}}
      # Plain UDP/TCP only by default — no TLS cert required to get a working deploy. The turns://
      # (port 443) rung needs a real cert for coturn and, on most Dokploy hosts, a free 443 that
      # Traefik isn't already holding — see the doc link at the top before enabling it, then set
      # this var directly to add a third entry.
      MERIDIAN_RENDEZVOUS_TURN__URLS: ${MERIDIAN_RENDEZVOUS_TURN__URLS:-["turn:${TURN_DOMAIN:-turn.example.com}:3478?transport=udp","turn:${TURN_DOMAIN:-turn.example.com}:3478?transport=tcp"]}
      MERIDIAN_RENDEZVOUS_TURN__TTL_SECS: ${MERIDIAN_RENDEZVOUS_TURN__TTL_SECS:-120}

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:latest}   # pin a specific tag for reproducible prod deploys
    pull_policy: always   # see the same note on the rendezvous service above
    restart: unless-stopped
    # Bridge networking, not `network_mode: host`: Dokploy (and some other compose hosts) injects
    # its own `networks:` into every service it runs for routing/service-discovery, which the
    # Compose spec forbids combining with `network_mode` — a compose bringing coturn up under
    # Dokploy with host networking fails outright ("mutually exclusive network_mode and networks").
    # The relay port range below is bounded down from coturn's 49152-65535 default specifically so
    # it stays a single short Docker port-publish range instead of ~16k individual mappings.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49352}:${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49352}/udp"
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # Uncomment once you've provisioned a real TLS cert for TURN_DOMAIN (out of band — this repo
      # never bakes in cert material) and add tls-listening-port/alt-tls-listening-port to `command:`.
      # - ./certs:/etc/coturn/certs:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET — see the rendezvous service above, must be identical}"
      - "--realm=${TURN_DOMAIN:-turn.example.com}"
      # Must match the `ports:` range above.
      - "--min-port=${TURN_RELAY_MIN_PORT:-49152}"
      - "--max-port=${TURN_RELAY_MAX_PORT:-49352}"
      # Required under bridge networking: without it, coturn hands clients its private container IP
      # as the relay candidate and every relayed call fails. Set to this host's public IP (the one
      # TURN_DOMAIN resolves to).
      - "--external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP to this host's public IP — see docs/operations/docker-image.md §6}"

volumes:
  rendezvous_data:
